<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marlboro XC Training Hub - Schedule</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Marlboro XC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="schedule.html">Schedule</a></li>
          <li class="nav-item"><a class="nav-link" href="workouts.html">Workouts</a></li>
          <li class="nav-item"><a class="nav-link" href="recovery.html">Recovery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main id="app" class="py-5">
    <div class="container">
      <h1 class="text-center mb-5 animate-fade-in">Weekly Training Schedule</h1>
      <img src="https://picsum.photos/800/300?random=2" alt="Training schedule" class="img-fluid rounded shadow mb-5 animate-zoom-in">

      <div v-for="(week, weekKey) in schedule" :key="weekKey" class="mb-5">
        <h3 class="text-center mb-4">{{ week.weekOf }}</h3>
        <div class="row g-3">
          <div v-for="day in week.days" :key="day.date" class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-lg hover-lift" :class="{ 'border-primary': !day.isRest, 'bg-light': day.isRest }">
              <div class="card-body">
                <h5 class="card-title d-flex justify-content-between">
                  {{ day.day }} • {{ day.date }}
                  <span class="badge" :class="day.isRest ? 'bg-secondary' : 'bg-success'">{{ day.type }}</span>
                </h5>
                <p class="card-text mb-3">{{ day.summary }}</p>
                <a v-if="day.workoutId" :href="'workouts.html?id=' + day.workoutId" class="btn btn-sm btn-outline-primary">View Details →</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Marlboro XC Training Hub. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
