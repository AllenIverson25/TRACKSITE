<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marlboro XC Training Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <header></header>
  <nav>
    <nav class="navbar navbar-expand-lg bg-body-tertiary sticky-top">
  <div class="container">
    <a class="navbar-brand" href="#">Marlboro XC</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#schedule">Schedule</a></li>
        <li class="nav-item"><a class="nav-link" href="#workouts">Workouts</a></li>
        <li class="nav-item"><a class="nav-link" href="#recovery">Recovery</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
  </nav>
  <main id="app">
    <section id="home" class="mb-5">
  <h1 class="text-center display-5 fw-bold mb-4">Marlboro XC Training</h1>
  <p class="lead text-center text-muted mb-5">Weekly schedules • Workout details • Recovery tips</p>

  <div class="card mb-5 shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Announcements</h5>
    </div>
    <div class="list-group list-group-flush">
      <div v-for="ann in announcements" :key="ann.date" class="list-group-item">
        <small class="text-muted">{{ ann.date }}</small>
        <h6>{{ ann.title }}</h6>
        <p class="mb-0">{{ ann.text }}</p>
      </div>
      <div v-if="!announcements.length" class="text-center py-4 text-muted">
        No announcements yet
      </div>
    </div>
  </div>

  <div class="text-center">
    <button class="btn btn-primary btn-lg" @click="$refs.schedule.scrollIntoView({behavior:'smooth'})">
      View Schedule →
    </button>
  </div>
</section>
  </main>
  <footer></footer>

  <script src="assets/js/main.js" type="module"></script>
</body>
</html>
